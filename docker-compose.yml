services:
  nginx:
    image: nginx:1.30
    container_name: magento249_nginx
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - magento

  php:
    build:
      context: ./docker/php
    container_name: magento249_php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html:cached
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      PHP_MEMORY_LIMIT: 4G
    depends_on:
      - db
      - opensearch
      - valkey
    networks:
      - magento

  db:
    image: mariadb:12.3
    container_name: magento249_db
    command:
      - --max_allowed_packet=256M
      - --optimizer_use_condition_selectivity=1
      - --optimizer_switch=rowid_filter=off
      - --log_bin_trust_function_creators=1
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: magento
      MARIADB_USER: magento
      MARIADB_PASSWORD: magento
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - magento

  opensearch:
    image: opensearchproject/opensearch:3
    container_name: magento249_opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Test$1234!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - magento

  valkey:
    image: valkey/valkey:9
    container_name: magento249_valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - magento

  mailpit:
    image: axllent/mailpit:latest
    container_name: magento249_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - magento

volumes:
  db_data:
  opensearch_data:
  valkey_data:
  composer_cache:

networks:
  magento:
    driver: bridge
