services:
  nginx:
    image: nginx:1.30
    depends_on:
      - php
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ${MAGENTO_SRC:-./src}:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - magento

  php:
    build:
      context: ./docker/php
    working_dir: /var/www/html
    volumes:
      - ${MAGENTO_SRC:-./src}:/var/www/html:cached
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      PHP_MEMORY_LIMIT: 4G
    depends_on:
      - db
      - opensearch
      - valkey
    networks:
      - magento

  db:
    image: mariadb:12.3
    command:
      - --max_allowed_packet=256M
      - --optimizer_use_condition_selectivity=1
      - --optimizer_switch=rowid_filter=off
      - --log_bin_trust_function_creators=1
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-magento}
      MARIADB_USER: ${DB_USER:-magento}
      MARIADB_PASSWORD: ${DB_PASSWORD:-magento}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - magento

  opensearch:
    image: opensearchproject/opensearch:3
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-Admin123StrongPass2026!}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_PERFORMANCE_PORT:-9600}:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - magento

  valkey:
    image: valkey/valkey:9
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    networks:
      - magento

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - magento

volumes:
  db_data:
  opensearch_data:
  valkey_data:
  composer_cache:

networks:
  magento:
    driver: bridge